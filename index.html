    // Fungsi untuk menambahkan logo bulat ke PDF menggunakan canvas clipping
    const addLogoToPDF = (doc, x, y, size) => {
        try {
            const px = Math.round(size * 3.7795 * 2); // mm ke px, resolusi 2x
            const canvas = document.createElement("canvas");
            canvas.width = px; canvas.height = px;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, px, px);
            // Clip lingkaran sempurna sebelum gambar logo
            ctx.beginPath();
            ctx.arc(px / 2, px / 2, px / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(LOGO_IMG, 0, 0, px, px);
            const pngData = canvas.toDataURL("image/png");
            doc.addImage(pngData, "PNG", x, y, size, size);
        } catch(e) {
            // Fallback jika canvas gagal
            doc.setFillColor(15, 52, 96);
            doc.circle(x + size/2, y + size/2, size/2, "F");
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(5);
            doc.text("OTBAN", x + size/2, y + size/2 + 1, { align: "center" });
        }
    };

        if (hasEmployee && pegawaiJabatan) textBlockH += rowGap + rJabatan;

        const logoSize    = 22;
        const borderPad   = 1.5;
        const totalLogoH  = logoSize + borderPad * 2;
        const padSymm = 5;
        const accentH = 4;
        const headerH = Math.max(textBlockH, totalLogoH) + padSymm * 2 + accentH;

        try {
            const scale = 2;
            const gCvs = document.createElement("canvas");
            gCvs.width  = Math.round(pageWidth  * 3.7795 * scale);
            gCvs.height = Math.round(headerH    * 3.7795 * scale);
            const gCtx  = gCvs.getContext("2d");
            // Gradient utama: kiri gelap → kanan agak terang
            const grad = gCtx.createLinearGradient(0, 0, gCvs.width, gCvs.height);
            grad.addColorStop(0,   "rgb(5, 20, 60)");
            grad.addColorStop(0.4, "rgb(15, 50, 140)");
            grad.addColorStop(0.7, "rgb(20, 65, 160)");
            grad.addColorStop(1,   "rgb(8, 30, 90)");
            gCtx.fillStyle = grad;
            gCtx.fillRect(0, 0, gCvs.width, gCvs.height);

            // Overlay diagonal stripe halus di kanan atas (semi-transparan putih)
            gCtx.save();
            gCtx.globalAlpha = 0.04;
            gCtx.fillStyle = "#fff";
            const stripeW = 18 * scale * 3.7795;
            const stripeGap = 36 * scale * 3.7795;
            for (let sx = gCvs.width * 0.45; sx < gCvs.width + gCvs.height; sx += stripeGap) {
                gCtx.beginPath();
                gCtx.moveTo(sx, 0);
                gCtx.lineTo(sx + stripeW, 0);
                gCtx.lineTo(sx + stripeW - gCvs.height, gCvs.height);
                gCtx.lineTo(sx - gCvs.height, gCvs.height);
                gCtx.closePath();
                gCtx.fill();
            }
            gCtx.restore();

            doc.addImage(gCvs.toDataURL("image/png"), "PNG", 0, 0, pageWidth, headerH);
        } catch(e) {
            doc.setFillColor(8, 30, 90);
            doc.rect(0, 0, pageWidth, headerH, "F");
        }

        // ── ORNAMEN BARU: Lengkungan elegan di kanan + dot grid di pojok kanan atas ──
        try {
            const usH = headerH - accentH;

            // 1. Arc dekoratif di kanan (seperti emblem/badge lingkaran)
            doc.setDrawColor(255, 255, 255);
            const arcCX = pageWidth - 2, arcCY = usH / 2;
            doc.setLineWidth(0.5);
            doc.setGState(doc.GState({ opacity: 0.08 }));
            doc.circle(arcCX, arcCY, 28, "S");
            doc.setGState(doc.GState({ opacity: 0.12 }));
            doc.circle(arcCX, arcCY, 19, "S");
            doc.setGState(doc.GState({ opacity: 0.18 }));
            doc.circle(arcCX, arcCY, 11, "S");

            // 2. Dot grid 6×4 pojok kanan atas — gradasi opacity
            doc.setFillColor(255, 255, 255);
            const dCols = 6, dRows = 4, dGap = 3.8, dR = 0.5;
            const dX0 = pageWidth - 12 - (dCols - 1) * dGap;
            const dY0 = 3.5;
            for (let r = 0; r < dRows; r++) {
                for (let c = 0; c < dCols; c++) {
                    const alpha = 0.07 + c * 0.03 + (dRows - 1 - r) * 0.015;
                    doc.setGState(doc.GState({ opacity: Math.min(alpha, 0.30) }));
                    doc.circle(dX0 + c * dGap, dY0 + r * dGap, dR, "F");
                }
            }

            // 3. (separator horizontal & bracket vertikal dihapus)

            doc.setGState(doc.GState({ opacity: 1 }));
        } catch(e) { /* skip */ }

        // ── ACCENT BAWAH: gradient kuning-emas → biru ──
        try {
            const aCvs = document.createElement("canvas");
            aCvs.width = Math.round(pageWidth * 3.7795 * 2);
            aCvs.height = Math.round(accentH * 3.7795 * 2);
            const aCtx = aCvs.getContext("2d");
            const ag = aCtx.createLinearGradient(0, 0, aCvs.width, 0);
            ag.addColorStop(0,    "rgb(30, 64, 175)");   // biru kiri
            ag.addColorStop(0.30, "rgb(234, 179, 8)");   // kuning/emas
            ag.addColorStop(0.55, "rgb(251, 191, 36)");  // emas terang
            ag.addColorStop(0.75, "rgb(234, 179, 8)");
            ag.addColorStop(1,    "rgb(30, 64, 175)");   // biru kanan
            aCtx.fillStyle = ag;
            aCtx.fillRect(0, 0, aCvs.width, aCvs.height);
            doc.addImage(aCvs.toDataURL("image/png"), "PNG", 0, headerH - accentH, pageWidth, accentH);
        } catch(e) {
            doc.setFillColor(234, 179, 8);
            doc.rect(0, headerH - accentH, pageWidth, accentH, "F");
        }

        // ── KOLOM KIRI: Logo ──
        const logoX   = 8;
        const usableH = headerH - accentH;
        const logoY   = (usableH - totalLogoH) / 2;
        const logoCX  = logoX + (logoSize + borderPad * 2) / 2;
        const logoCY  = logoY + (logoSize + borderPad * 2) / 2;
        const logoR   = (logoSize + borderPad * 2) / 2;

        // Shadow
        doc.setFillColor(0, 0, 0);
        doc.setGState(doc.GState({ opacity: 0.22 }));
        doc.circle(logoCX + 0.5, logoCY + 0.7, logoR + 1.4, "F");
        doc.setGState(doc.GState({ opacity: 1 }));

        // Ring emas tipis di luar logo
        doc.setFillColor(234, 179, 8);
        doc.circle(logoCX, logoCY, logoR + 2.0, "F");
        // Ring putih
        doc.setFillColor(255, 255, 255);
        doc.circle(logoCX, logoCY, logoR + 0.9, "F");
        // Logo
        addLogoToPDF(doc, logoX + borderPad, logoY + borderPad, logoSize);

        // ── TEKS TENGAH ──
        const ML = 10, MR = 10;
        const centerX = (ML + (pageWidth - MR)) / 2;
        let curY = padSymm + rKantor;

        // 1. Sub-judul kecil
        doc.setFontSize(5.5);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(180, 210, 255);
        doc.text("DIREKTORAT JENDERAL PERHUBUNGAN UDARA", centerX, curY - 1.5, { align: "center" });

        doc.setFontSize(6.5);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(255, 255, 255);
        doc.text("KANTOR OTORITAS BANDAR UDARA WILAYAH X · MERAUKE", centerX, curY + 1.5, { align: "center" });
        curY += rowGap + rData;

        // 2. Judul utama
        doc.setFontSize(20);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(255, 255, 255);
        doc.text("DATA RAMP INSPECTION", centerX, curY, { align: "center" });

        curY += rowGap + rPeriode;

        // 3. Periode
        if (hasPeriode) {
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(253, 230, 138);   // kuning muda
            doc.text(periodeText.toUpperCase(), centerX, curY, { align: "center" });
        }
        curY += rowGap + rSeksi;

        // 4. Seksi
        doc.setFontSize(5.5);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(180, 210, 255);
        doc.text("SEKSI KELAIKUDARAAN & PENGOPERASIAN PESAWAT UDARA", centerX, curY, { align: "center" });
        curY += rowGap + rNama;

        // 5. Nama & jabatan pegawai
        if (hasEmployee) {

            doc.setFont("helvetica", "bold");
            doc.setTextColor(255, 255, 255);
            doc.text(pegawaiNama, centerX, curY, { align: "center" });

            if (pegawaiJabatan) {
                doc.setFontSize(5.5);
                doc.setFont("helvetica", "normal");
                doc.setTextColor(180, 210, 255);
                doc.text(pegawaiJabatan, centerX, curY, { align: "center" });
            }
        }

        return headerH;
    };
    
    // Fungsi drawDonutChart yang diperbaiki
    const drawDonutChart = (doc, x, y, size, s, mi, ma, total) => {
        const centerX = x + size / 2;
        const centerY = y + size / 2;
        const radius = size / 2;
        const innerRadius = radius - 9;
        
        if (total === 0) {
            doc.setFillColor(226, 232, 240);
            doc.circle(centerX, centerY, radius, "F");
            doc.setTextColor(100, 116, 139);
            doc.setFontSize(8);
            doc.text("Tidak ada data", centerX, centerY, { align: "center" });
            return;
        }
        
        let startAngle = -90;
        const segments = [
            { v: s, r: 34, g: 197, b: 94 },
            { v: mi, r: 249, g: 115, b: 22 },
            { v: ma, r: 239, g: 68, b: 68 }
        ];
        
        segments.forEach(seg => {
            if (!seg.v) return;
            const angle = (seg.v / total) * 360;
            const endAngle = startAngle + angle;
            for (let a = startAngle; a < endAngle; a += 1) {
                const rad = (a * Math.PI) / 180;
                const radNext = ((a + 1) * Math.PI) / 180;
                const x1 = centerX + radius * Math.cos(rad);
                const y1 = centerY + radius * Math.sin(rad);
                const x2 = centerX + radius * Math.cos(radNext);
                const y2 = centerY + radius * Math.sin(radNext);
                doc.setFillColor(seg.r, seg.g, seg.b);
                doc.triangle(centerX, centerY, x1, y1, x2, y2, "F");
            }
            startAngle = endAngle;
        });
        
        // Inner circle putih
        doc.setFillColor(255, 255, 255);
        doc.circle(centerX, centerY, innerRadius, "F");
        
        // Text total di tengah
        doc.setTextColor(30, 41, 59);
        doc.setFontSize(11);
        doc.setFont("helvetica", "bold");
        doc.text(String(total), centerX, centerY + 1.5, { align: "center" });
        doc.setFontSize(5.5);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(100, 116, 139);
        doc.text("Total", centerX, centerY + 8, { align: "center" });
    };
    
    // Fungsi untuk menggambar legenda chart
    const drawChartLegend = (doc, x, y, s, mi, ma, total, sig) => {
        const sigVal = sig || 0;
        const items = [
            { label: "Satisfactory", value: s, r: 34, g: 197, b: 94, pct: total > 0 ? ((s/total)*100).toFixed(0) : 0 },
            { label: "Minor Finding", value: mi, r: 249, g: 115, b: 22, pct: total > 0 ? ((mi/total)*100).toFixed(0) : 0 },
            { label: "Significant Finding", value: sigVal, r: 234, g: 88, b: 12, pct: total > 0 ? ((sigVal/total)*100).toFixed(0) : 0 },
            { label: "Major Finding", value: ma, r: 239, g: 68, b: 68, pct: total > 0 ? ((ma/total)*100).toFixed(0) : 0 }
        ];
        
        let ly = y;
        items.forEach(item => {
            // Kotak warna
            doc.setFillColor(item.r, item.g, item.b);
            doc.roundedRect(x, ly - 3, 5, 5, 1, 1, "F");
            
            // Label
            doc.setFontSize(7.5);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(item.r, item.g, item.b);

            // Nilai
            doc.setFont("helvetica", "normal");
            doc.setTextColor(30, 41, 59);
            doc.text(`: ${item.value} (${item.pct}%)`, x + 7, ly + 6.5);
            
            ly += 16;
        });
        
        // Total line
        doc.setDrawColor(200, 213, 225);
        doc.setLineWidth(0.3);
        doc.line(x, ly - 4, x + 55, ly - 4);

        doc.setFont("helvetica", "bold");
        doc.setTextColor(30, 41, 59);
        doc.text("Total Inspeksi", x, ly + 1);

    };
    
    const drawBarChart = (doc, x, y, width, height, monthlyData, title) => {
        if (!monthlyData || monthlyData.length === 0) return;
        
        const marginLeft = 18;
        const marginRight = 4;
        const marginTop = 6;
        const marginBottom = 20;
        const chartWidth = width - marginLeft - marginRight;
        const chartHeight = height - marginTop - marginBottom;
        
        // Background
        doc.setFillColor(248, 250, 252);
        doc.roundedRect(x, y, width, height, 3, 3, "F");
        doc.setDrawColor(220, 228, 240);
        doc.setLineWidth(0.4);
        doc.roundedRect(x, y, width, height, 3, 3, "S");
        
        // Judul grafik dihapus
        
        const maxVal = Math.max(...monthlyData.map(m => m.s + m.mi + (m.sig||0) + m.ma), 1);
        
        // Grid lines & Y-axis labels — setiap angka bulat dari 0 sampai maxVal
        for (let val = 0; val <= maxVal; val++) {
            const lineY = y + marginTop + chartHeight - (val / maxVal) * chartHeight;
            doc.setDrawColor(val === 0 ? 148 : 226, val === 0 ? 163 : 232, val === 0 ? 184 : 240);
            doc.setLineWidth(val === 0 ? 0.6 : 0.25);
            doc.line(x + marginLeft, lineY, x + marginLeft + chartWidth, lineY);
            doc.setTextColor(100, 116, 139);
            doc.setFontSize(6);
            doc.setFont("helvetica", "normal");
            doc.text(String(val), x + marginLeft - 2, lineY + 1.5, { align: "right" });
        }
        
        // Bar center tepat di tengah slot bulan
        const colWidth = chartWidth / 12;
        const barWidth = Math.max(colWidth * 0.70, 5);
        
        monthlyData.forEach((m, idx) => {
            const cx = x + marginLeft + (idx + 0.5) * colWidth;
            const barX = cx - barWidth / 2;
            const totalVal = m.s + m.mi + (m.sig||0) + m.ma;
            if (totalVal === 0) {
                doc.setFontSize(6);
                doc.setTextColor(180, 190, 210);
                doc.text("-", barX + barWidth / 2, y + marginTop + chartHeight - 2, { align: "center" });
            } else {
                let currentY = y + marginTop + chartHeight;
                [[m.s, 34, 197, 94], [m.mi, 249, 115, 22], [m.sig||0, 234, 88, 12], [m.ma, 239, 68, 68]].forEach(([v, r, g, b]) => {
                    if (!v) return;
                    const bh = (v / maxVal) * chartHeight;
                    currentY -= bh;
                    doc.setFillColor(r, g, b);
                    doc.rect(barX, currentY, barWidth, bh, "F");
                });
                // Label nilai di atas bar
                doc.setFontSize(7);
                doc.setFont("helvetica", "bold");
                doc.setTextColor(30, 41, 59);
                doc.text(String(totalVal), barX + barWidth / 2, currentY - 1.5, { align: "center" });
            }
            
            // Label bulan di bawah bar
            doc.setFontSize(6.5);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(71, 85, 105);
            doc.text(BULAN[idx].slice(0, 3), cx, y + marginTop + chartHeight + 6, { align: "center" });
        });
        
        // Legenda di bawah chart
        const legendY = y + marginTop + chartHeight + 14;
        const legendItems = [
            { label: "Satisfactory", r: 34, g: 197, b: 94 },
            { label: "Minor Finding", r: 249, g: 115, b: 22 },
            { label: "Significant Finding", r: 234, g: 88, b: 12 },
            { label: "Major Finding", r: 239, g: 68, b: 68 }
        ];
        const legendSpacing = chartWidth / 4;
        legendItems.forEach((item, i) => {
            const lx = x + marginLeft + i * legendSpacing;
            doc.setFillColor(item.r, item.g, item.b);
            doc.roundedRect(lx, legendY - 3, 5, 4.5, 1, 1, "F");
            doc.setFontSize(7);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(30, 41, 59);
            doc.text(item.label, lx + 7, legendY + 0.5);
        });
    };
    
    // Fungsi untuk format tanggal cetak
    const getPrintDate = () => {
        const now = new Date();
        const d = p2(now.getDate());
        const m = p2(now.getMonth() + 1);
        const y = now.getFullYear();
        return `${d}/${m}/${y}`;
    };
    
    // Fungsi footer PDF

    // Fungsi ornamen area konten halaman PDF — hanya separator bersih
    const drawPageOrnaments = (doc, pageWidth, pageHeight, hdrH) => {
        // Garis tipis biru halus di bawah header sebagai separator konten
        doc.setDrawColor(29, 78, 216);

    // ==============================================================
    // HELPER: Halaman terakhir — tabel data per maskapai lalu bulan
    // ==============================================================
    const drawMaskapaiPages = (doc, recs, pageWidth, pageHeight, hdrH, periodeText) => {
        if (!recs || recs.length === 0) return;

        const ML = 10, MR = 10;
        const colW = {
            no:       7,
            tgl:      20,
            tipe:     26,
            serial:   24,
            bandara:  36,
            routeFrom:13,
            flFrom:   22,
            routeTo:  13,
            flTo:     22,
            status:   24,
        };
        const totalColW = Object.values(colW).reduce((a,b)=>a+b,0);
        const scale = (pageWidth - ML - MR) / totalColW;
        const cw = {};
        Object.keys(colW).forEach(k => { cw[k] = colW[k] * scale; });

        const colKeys  = ["no","tgl","tipe","serial","bandara","routeFrom","flFrom","routeTo","flTo","status"];
        // Header 1 baris saja — tidak ada \n
        const headers  = ["No", "Tanggal", "Tipe Pesawat", "Serial No.", "Bandara", "Route From", "Flt No. From", "Route To", "Flt No. To", "Hasil Inspeksi"];
        const rowH  = 7;
        const hdrH2 = 8;

        // Helper: gambar border grid untuk satu baris
        const drawRowBorder = (y, h) => {
            doc.setDrawColor(203, 213, 225);
            doc.setLineWidth(0.25);
            // Garis luar kiri-kanan-atas-bawah
            doc.rect(ML, y, pageWidth - ML - MR, h);
            // Garis vertikal antar kolom
            let lx = ML;
            colKeys.forEach((k, i) => {
                lx += cw[k];
                if (i < colKeys.length - 1) doc.line(lx, y, lx, y + h);
            });
        };

        // Helper: gambar header tabel
        const drawTableHeader = (yPos) => {
            // Background biru penuh
            doc.setFillColor(29, 78, 216);
            doc.rect(ML, yPos, pageWidth - ML - MR, hdrH2, "F");

            // Garis vertikal putih antar kolom di header
            doc.setDrawColor(255, 255, 255);
            doc.setLineWidth(0.3);
            let lx = ML;
            colKeys.forEach((k, i) => {
                lx += cw[k];
                if (i < colKeys.length - 1) doc.line(lx, yPos, lx, yPos + hdrH2);
            });
            // Border luar header
            doc.setDrawColor(15, 52, 150);
            doc.setLineWidth(0.4);
            doc.rect(ML, yPos, pageWidth - ML - MR, hdrH2);

            // Teks header — center horizontal & vertical sempurna per kolom
            // jsPDF: koordinat Y = baseline teks. Tinggi caps ≈ fontSize(pt) * 0.352 mm/pt * 0.72 (cap-height ratio)
            doc.setFontSize(6.2);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(255, 255, 255);
            const capHeightMm = 6.2 * 0.352 * 0.72; // ~1.57 mm
            const textY = yPos + (hdrH2 / 2) + (capHeightMm / 2);
            let cx = ML;
            headers.forEach((h, i) => {
                const key = colKeys[i];
                doc.text(h, cx + cw[key] / 2, textY, { align: "center" });
                cx += cw[key];
            });
        };

        // Kumpulkan maskapai unik, urutkan abjad
        const maskapaiList = [...new Set(recs.map(r => r.maskapai))].sort((a,b)=>a.localeCompare(b));

        maskapaiList.forEach(maskapai => {
            const mRecs = recs
                .filter(r => r.maskapai === maskapai)
                .sort((a,b) => new Date(a.tanggal+"T00:00:00") - new Date(b.tanggal+"T00:00:00"));
            if (mRecs.length === 0) return;

            doc.addPage();
            drawPDFHeader(doc, pageWidth, pageHeight, periodeText);

            let yPos = hdrH + 8;

            // Judul maskapai
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(29, 78, 216);
            doc.text(maskapai.toUpperCase(), pageWidth / 2, yPos + 4, { align: "center" });
            doc.setDrawColor(29, 78, 216);
            doc.setLineWidth(0.5);
            doc.line(ML, yPos + 7, pageWidth - MR, yPos + 7);
            yPos += 12;

            drawTableHeader(yPos);
            yPos += hdrH2;

            mRecs.forEach((r, idx) => {
                // Halaman baru jika perlu
                if (yPos + rowH > pageHeight - 14) {
                    doc.addPage();
                    drawPDFHeader(doc, pageWidth, pageHeight, periodeText);
                    yPos = hdrH + 8;

                    doc.setFontSize(10);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(29, 78, 216);
                    doc.text(maskapai.toUpperCase() + " (lanjutan)", pageWidth / 2, yPos + 4, { align: "center" });
                    doc.setDrawColor(29, 78, 216);
                    doc.setLineWidth(0.5);
                    doc.line(ML, yPos + 7, pageWidth - MR, yPos + 7);
                    yPos += 12;

                    drawTableHeader(yPos);
                    yPos += hdrH2;
                }

                // Background baris alternating
                const isEven = idx % 2 === 0;
                doc.setFillColor(isEven ? 248 : 255, isEven ? 250 : 255, isEven ? 252 : 255);
                doc.rect(ML, yPos, pageWidth - ML - MR, rowH, "F");

                // Status warna
                let statusColor = [22, 163, 74];
                let statusBg    = [220, 252, 231];
                if (r.status === "Minor Finding") { statusColor = [234, 88, 12]; statusBg = [255, 237, 213]; }
                if (r.status === "Major Finding") { statusColor = [220, 38, 38]; statusBg = [254, 226, 226]; }

                const values = [
                    String(idx + 1),
                    r.tanggal || "-",
                    r.tipePesawat || "-",
                    r.aircraftSerialNumber || "-",
                    r.bandara || "-",
                    r.routeFrom || "-",
                    r.flightNumberFrom || "-",
                    r.routeTo || "-",
                    r.flightNumberTo || "-",
                    r.status || "-",
                ];

                let cx = ML;
                values.forEach((val, i) => {
                    const key = colKeys[i];
                    const isStatus = key === "status";
                    const textColor = isStatus ? statusColor : [30, 41, 59];
                    const isBold = (key === "no" || key === "status" || key === "routeFrom" || key === "routeTo");

                    if (isStatus) {
                        doc.setFillColor(statusBg[0], statusBg[1], statusBg[2]);
                        doc.roundedRect(cx + 1, yPos + 1, cw[key] - 2, rowH - 2, 1.5, 1.5, "F");
                    }

            const finalTipe = tipe === "Lainnya" ? tipeCus.trim() : tipe;

            const err = {};

        if (isIns && jl.includes("ahli madya"))   return 0;
        if (isIns && jl.includes("ahli muda"))    return 1;
        if (isIns && jl.includes("ahli pertama")) return 2;

        if (isAss && jl.includes("penyelia"))  return 3;
        if (isAss && jl.includes("mahir"))     return 4;
        if (isAss && jl.includes("terampil"))  return 5;
